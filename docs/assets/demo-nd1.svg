<?xml version="1.0" encoding="UTF-8"?>
<!-- 律鉴终端 demo 截图 · ND1 时间锚点机制 · 静态 SVG -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Menlo, Monaco, Consolas, monospace">
  <defs>
    <linearGradient id="term-bg" x1="0" y1="0" x2="0" y2="500">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>

  <!-- 终端窗口 -->
  <rect x="0" y="0" width="800" height="500" rx="10" fill="url(#term-bg)" filter="url(#shadow)"/>
  <!-- 标题栏 -->
  <rect x="0" y="0" width="800" height="36" rx="10" fill="#2a2a3e"/>
  <rect x="0" y="30" width="800" height="6" fill="#2a2a3e"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27c93f"/>
  <text x="400" y="22" text-anchor="middle" font-size="11" fill="#909090">律鉴 (PRC-Law) — ND1: 时间锚点 · 消法版本</text>

  <!-- 用户输入 -->
  <text x="20" y="80" font-size="13" fill="#27c93f">❯</text>
  <text x="40" y="80" font-size="13" fill="#ffffff">查 2007 年消费者购车欺诈案的赔偿标准</text>

  <text x="20" y="105" font-size="13" fill="#888888">  [调用 cn-legal-retrieval,refer_date=2007-09-01]</text>

  <!-- AI 分析 -->
  <text x="20" y="140" font-size="13" fill="#c9a961">⚖️ 律鉴分析:</text>

  <text x="20" y="165" font-size="13" fill="#ffffff">  • 时间锚点: 2007-09-01 (购车日期)</text>
  <text x="20" y="185" font-size="13" fill="#ffffff">  • 适用法律: 《消费者权益保护法》(1993 版)</text>
  <text x="20" y="205" font-size="13" fill="#ffffff">  • 关键条文: 第 49 条</text>

  <!-- 关键结论高亮 -->
  <rect x="20" y="225" width="760" height="50" fill="#c9a961" opacity="0.15" rx="4"/>
  <text x="40" y="248" font-size="14" font-weight="bold" fill="#c9a961">  退一赔一 (双倍赔偿)</text>
  <text x="40" y="268" font-size="11" fill="#909090">  [已确认: 元典 + 北大法宝 · 1993 版 · 2013-09-04 失效]</text>

  <!-- 对比 2013 版 -->
  <text x="20" y="300" font-size="13" fill="#ff6b6b">  ⚠️ 注意: 2013 版《消法》第 55 条「退一赔三」不适用本案</text>
  <text x="20" y="320" font-size="11" fill="#888888">     (2007 年购车,2013-09-04 才修订生效,行为时有效版本为 1993 版)</text>

  <!-- Benchmark -->
  <text x="20" y="365" font-size="13" fill="#27c93f">✓</text>
  <text x="40" y="365" font-size="13" fill="#ffffff"> 与最高法指导案例 17 号判决一致</text>
  <text x="40" y="385" font-size="11" fill="#888888">  张莉诉合力华通 (北京二中院,2008)</text>

  <!-- 底部 prompt -->
  <text x="20" y="445" font-size="13" fill="#27c93f">❯</text>
  <rect x="35" y="434" width="8" height="14" fill="#27c93f">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="50" y="445" font-size="11" fill="#5a5a5a">▌ 5.3s 完成 · 1 API 调用 · ¥0 (prc-law-data 命中)</text>
</svg>