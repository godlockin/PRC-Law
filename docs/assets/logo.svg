<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="SimSun, serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c9a961"/>
      <stop offset="100%" stop-color="#e8c872"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="200" fill="url(#bg)"/>

  <!-- 主图标：天平 + 法律元素 -->
  <g transform="translate(60, 100)">
    <!-- 天平底座 -->
    <rect x="-30" y="40" width="60" height="6" fill="url(#gold)"/>
    <rect x="-3" y="20" width="6" height="20" fill="url(#gold)"/>
    <rect x="-25" y="46" width="50" height="4" fill="url(#gold)"/>

    <!-- 天平横梁 -->
    <rect x="-50" y="0" width="100" height="4" fill="url(#gold)"/>

    <!-- 天平吊绳 -->
    <line x1="-30" y1="4" x2="-30" y2="20" stroke="url(#gold)" stroke-width="1.5"/>
    <line x1="30" y1="4" x2="30" y2="20" stroke="url(#gold)" stroke-width="1.5"/>
    <line x1="0" y1="4" x2="0" y2="-20" stroke="url(#gold)" stroke-width="1.5"/>

    <!-- 天平托盘 -->
    <path d="M -42 20 L -18 20 L -22 24 L -38 24 Z" fill="url(#gold)"/>
    <path d="M 18 20 L 42 20 L 38 24 L 22 24 Z" fill="url(#gold)"/>

    <!-- 中心节点 -->
    <circle cx="0" cy="-22" r="4" fill="#e8c872"/>
    <text x="0" y="-30" text-anchor="middle" font-size="8" fill="#e8c872">法</text>
  </g>

  <!-- 文字部分 -->
  <g transform="translate(160, 70)">
    <text x="0" y="0" font-size="48" font-weight="bold" fill="url(#gold)" letter-spacing="2">律鉴</text>
    <text x="0" y="36" font-size="16" fill="#c9c9c9" letter-spacing="1">PRC-Law</text>
  </g>

  <!-- 副标题 -->
  <g transform="translate(160, 140)">
    <text x="0" y="0" font-size="14" fill="#a0a0a0">中国法律 AI 助手</text>
    <text x="0" y="22" font-size="11" fill="#7a7a7a">Time-Anchored · Multi-Skill · Real Cases</text>
  </g>

  <!-- 右侧装饰 -->
  <g transform="translate(480, 50)">
    <rect x="0" y="0" width="80" height="100" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.3"/>
    <text x="40" y="30" text-anchor="middle" font-size="10" fill="#a0a0a0">v9.2</text>
    <text x="40" y="48" text-anchor="middle" font-size="9" fill="#7a7a7a">152 skills</text>
    <text x="40" y="62" text-anchor="middle" font-size="9" fill="#7a7a7a">6 demos</text>
    <text x="40" y="76" text-anchor="middle" font-size="9" fill="#7a7a7a">92% match</text>
  </g>
</svg>