  <text x="20" y="455" font-size="13" fill="#27c93f">❯</text>
  <rect x="35" y="444" width="8" height="14" fill="#27c93f">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="50" y="455" font-size="11" fill="#5a5a5a">▌ 2 分 45 秒 · 7 API 调用 · ¥0.08 · 报告路径已生成</text>
</svg>