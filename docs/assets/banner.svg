<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" font-family="SimSun, serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c9a961"/>
      <stop offset="50%" stop-color="#f0d185"/>
      <stop offset="100%" stop-color="#c9a961"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a961" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c9a961" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- 中央光晕 -->
  <ellipse cx="600" cy="150" rx="400" ry="120" fill="url(#glow)"/>

  <!-- 主图标 - 放大版天平 -->
  <g transform="translate(380, 150)">
    <!-- 底座 -->
    <rect x="-50" y="65" width="100" height="8" fill="url(#gold)"/>
    <rect x="-5" y="35" width="10" height="32" fill="url(#gold)"/>
    <rect x="-45" y="73" width="90" height="6" fill="url(#gold)"/>

    <!-- 顶柱 -->
    <rect x="-3" y="-30" width="6" height="65" fill="url(#gold)"/>

    <!-- 横梁 -->
    <rect x="-90" y="-30" width="180" height="6" fill="url(#gold)"/>

    <!-- 左侧吊绳+托盘 -->
    <line x1="-60" y1="-24" x2="-60" y2="0" stroke="url(#gold)" stroke-width="2"/>
    <line x1="60" y1="-24" x2="60" y2="0" stroke="url(#gold)" stroke-width="2"/>

    <path d="M -78 0 L -42 0 L -50 8 L -70 8 Z" fill="url(#gold)" opacity="0.9"/>
    <path d="M 42 0 L 78 0 L 70 8 L 50 8 Z" fill="url(#gold)" opacity="0.9"/>

    <!-- 中央圆形 - 法律 -->
    <circle cx="0" cy="-45" r="12" fill="#0a0a1a" stroke="url(#gold)" stroke-width="2"/>
    <text x="0" y="-40" text-anchor="middle" font-size="14" font-weight="bold" fill="url(#gold)">法</text>
  </g>

  <!-- 主标题 -->
  <g transform="translate(560, 130)">
    <text x="0" y="0" font-size="76" font-weight="bold" fill="url(#gold)" letter-spacing="4">律鉴</text>
    <text x="0" y="42" font-size="22" fill="#c9c9c9" letter-spacing="3">PRC-Law</text>
  </g>

  <!-- 副标题 -->
  <g transform="translate(560, 200)">
    <text x="0" y="0" font-size="20" fill="#d0d0d0">中国法律 AI 助手</text>
    <text x="0" y="28" font-size="13" fill="#909090">Time-Anchored · Multi-Skill · Real Cases</text>
  </g>

  <!-- 左侧装饰 - 关键数字 -->
  <g transform="translate(60, 100)">
    <text x="0" y="0" font-size="48" font-weight="bold" fill="url(#gold)">92%</text>
    <text x="0" y="22" font-size="11" fill="#a0a0a0">vs 最高法判决</text>
    <text x="0" y="60" font-size="28" font-weight="bold" fill="url(#gold)">152</text>
    <text x="0" y="80" font-size="11" fill="#a0a0a0">个技能</text>
    <text x="0" y="118" font-size="28" font-weight="bold" fill="url(#gold)">6</text>
    <text x="0" y="138" font-size="11" fill="#a0a0a0">个端到端 demo</text>
  </g>

  <!-- 右侧装饰 - 关键场景 -->
  <g transform="translate(980, 80)">
    <rect x="0" y="0" width="160" height="180" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.4" rx="4"/>
    <text x="80" y="20" text-anchor="middle" font-size="11" fill="#a0a0a0" letter-spacing="2">CORE SCENARIOS</text>
    <line x1="20" y1="30" x2="140" y2="30" stroke="url(#gold)" stroke-width="0.5" opacity="0.5"/>

    <text x="20" y="55" font-size="12" fill="#d0d0d0">⚖️ 律师 - 案件分析</text>
    <text x="20" y="80" font-size="12" fill="#d0d0d0">📄 法务 - 合同审查</text>
    <text x="20" y="105" font-size="12" fill="#d0d0d0">🔍 法务总监 - 调查</text>
    <text x="20" y="130" font-size="12" fill="#d0d0d0">📚 法学生 - 学习</text>

    <text x="80" y="160" text-anchor="middle" font-size="10" fill="#909090" font-style="italic">Try a demo →</text>
  </g>

  <!-- 底部版本 -->
  <g transform="translate(600, 280)">
    <text x="0" y="0" text-anchor="middle" font-size="10" fill="#5a5a5a" letter-spacing="2">v9.2 · 2026-08-04 · Apache-style custom license</text>
  </g>
</svg>