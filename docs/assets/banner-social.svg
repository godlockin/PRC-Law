<?xml version="1.0" encoding="UTF-8"?>
<!-- 律鉴社交分享 banner · 1200x630 · GitHub OG 标准尺寸 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c9a961"/>
      <stop offset="50%" stop-color="#f0d185"/>
      <stop offset="100%" stop-color="#c9a961"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#c9a961" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c9a961" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="252" rx="500" ry="200" fill="url(#glow)"/>

  <!-- 左侧 logo + 标题 -->
  <g transform="translate(80, 200)">
    <!-- 天平 -->
    <g transform="translate(0, 0)">
      <rect x="-3" y="-30" width="6" height="65" fill="url(#gold)"/>
      <rect x="-90" y="-30" width="180" height="6" fill="url(#gold)"/>
      <rect x="-5" y="35" width="10" height="32" fill="url(#gold)"/>
      <rect x="-50" y="65" width="100" height="8" fill="url(#gold)"/>
      <line x1="-60" y1="-24" x2="-60" y2="0" stroke="url(#gold)" stroke-width="2"/>
      <line x1="60" y1="-24" x2="60" y2="0" stroke="url(#gold)" stroke-width="2"/>
      <path d="M -78 0 L -42 0 L -50 8 L -70 8 Z" fill="url(#gold)" opacity="0.9"/>
      <path d="M 42 0 L 78 0 L 70 8 L 50 8 Z" fill="url(#gold)" opacity="0.9"/>
      <circle cx="0" cy="-45" r="14" fill="#0a0a1a" stroke="url(#gold)" stroke-width="2"/>
      <text x="0" y="-39" text-anchor="middle" font-size="16" font-weight="bold" fill="url(#gold)">法</text>
    </g>

    <!-- 主标题 -->
    <text x="170" y="-10" font-size="96" font-weight="bold" fill="url(#gold)" letter-spacing="6">律鉴</text>
    <text x="170" y="36" font-size="28" fill="#c9c9c9" letter-spacing="4">PRC-Law</text>
    <text x="170" y="84" font-size="22" fill="#d0d0d0">中国法律 AI 助手</text>
    <text x="170" y="118" font-size="14" fill="#909090" letter-spacing="3">Time-Anchored · Multi-Skill · Real Cases</text>
  </g>

  <!-- 右侧 - 公众号引导 -->
  <g transform="translate(900, 200)">
    <rect x="-180" y="-100" width="220" height="240" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6" rx="6"/>
    <text x="-70" y="-65" text-anchor="middle" font-size="14" fill="#c9c9c9" letter-spacing="2">关注公众号</text>
    <text x="-70" y="-40" text-anchor="middle" font-size="22" fill="url(#gold)" font-weight="bold">搞 AI 的陈老师</text>

    <!-- 模拟二维码占位 -->
    <rect x="-100" y="-15" width="120" height="120" fill="#ffffff" opacity="0.95" rx="4"/>
    <g transform="translate(-40, 45)" fill="#000">
      <rect x="0" y="0" width="14" height="14"/>
      <rect x="20" y="0" width="14" height="14"/>
      <rect x="40" y="0" width="14" height="14"/>
      <rect x="0" y="20" width="14" height="14"/>
      <rect x="40" y="20" width="14" height="14"/>
      <rect x="0" y="40" width="14" height="14"/>
      <rect x="20" y="40" width="14" height="14"/>
      <rect x="40" y="40" width="14" height="14"/>
    </g>

    <text x="-70" y="125" text-anchor="middle" font-size="11" fill="#909090">扫码关注公众号</text>
  </g>

  <!-- 底部关键数字 -->
  <g transform="translate(80, 510)">
    <text x="0" y="0" font-size="56" font-weight="bold" fill="url(#gold)">92%</text>
    <text x="0" y="22" font-size="12" fill="#a0a0a0">vs 最高法判决</text>

    <text x="180" y="0" font-size="56" font-weight="bold" fill="url(#gold)">152</text>
    <text x="180" y="22" font-size="12" fill="#a0a0a0">个 AI 技能</text>

    <text x="360" y="0" font-size="56" font-weight="bold" fill="url(#gold)">18,636</text>
    <text x="360" y="22" font-size="12" fill="#a0a0a0">部本地法律</text>

    <text x="600" y="0" font-size="56" font-weight="bold" fill="url(#gold)">¥0</text>
    <text x="600" y="22" font-size="12" fill="#a0a0a0">核心功能免费</text>
  </g>

  <!-- 底部品牌 -->
  <text x="600" y="610" text-anchor="middle" font-size="11" fill="#5a5a5a" letter-spacing="2">github.com/godlockin/PRC-Law · 独立开发者 · 资深 AI 从业者</text>
</svg>