name: PRC-Law Dual-Source Data Audit

on:
  schedule:
    # 每周二 03:00 UTC 运行 (北京时间 11:00) — 错跟 benchmark 周一
    # 北大法宝每天 10K 积分,周二跑避免跟 benchmark 周一冲撞
    - cron: '0 3 * * 2'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/data_audit.py'
      - 'scripts/w32_fill_gaps.py'
      - 'scripts/w33_benchmark.py'
      - 'scripts/pkulaw_mcp_bridge.py'
      - 'scripts/retrieval_router.py'

concurrency:
  group: dual-source-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dual-source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install datasets requests

      - name: Run W30 data audit (双线法条覆盖度审计)
        env:
          PKULAW_TOKEN: ${{ secrets.PKULAW_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 scripts/data_audit.py --output docs/dashboard/data_audit_latest.json
          # 复制当前报告到历史 (保留对比)
          cp docs/dashboard/data_audit_latest.json "docs/dashboard/data_audit_$(date +%Y%m%d-%H%M).json"

      - name: Run W33 benchmark (双盲类案覆盖度)
        env:
          PKULAW_TOKEN: ${{ secrets.PKULAW_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 scripts/w33_benchmark.py

      - name: Run W32 fill gaps (反哺 prc-law-data 缺口)
        env:
          PKULAW_TOKEN: ${{ secrets.PKULAW_TOKEN }}
        # 注意: W32 默认会创建新文件, --dry-run 模式只展示缺口
        # 真跑需手动 workflow_dispatch + 删除 --dry-run
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 scripts/w32_fill_gaps.py --dry-run > docs/dashboard/w32_gaps_latest.txt

      - name: Generate dashboard summary
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p docs/dashboard
          python3 <<'EOF'
          import json
          from pathlib import Path
          out = Path("docs/dashboard/SUMMARY.md")
          with out.open("w", encoding="utf-8") as f:
              f.write("# PRC-Law 双源数据审计面板\n\n")
              f.write(f"更新时间: {__import__('datetime').datetime.now().isoformat()}\n\n")
              # data_audit summary
              for f in ["docs/dashboard/data_audit_latest.json", "data/audit/w33_benchmark.json"]:
                  p = Path(f)
                  if p.exists():
                      try:
                          data = json.loads(p.read_text(encoding="utf-8"))
                          summary = data.get("summary", {})
                          if summary:
                              f.write(f"## {p.stem}\n\n")
                              f.write("| 指标 | 数值 |\n|------|------|\n")
                              for k, v in summary.items():
                                  f.write(f"| {k} | {v} |\n")
                              f.write("\n")
                      except Exception as e:
                          f.write(f"⚠️ {p}: {e}\n\n")
          print("✅ Dashboard SUMMARY.md 生成")
          EOF

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-source-audit-results
          path: |
            docs/dashboard/
            data/audit/
          retention-days: 90

      - name: Open issue on data gap (NEW gaps only)
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const audit = JSON.parse(fs.readFileSync('docs/dashboard/data_audit_latest.json', 'utf8'));
              const gaps = audit.summary?.pkulaw_only || 0;
              if (gaps > 0) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `[W32] prc-law-data 缺口 ${gaps} 条 (CI 自动报告)`,
                  body: `CI 周二跑发现 prc-law-data 缺口 ${gaps} 条法条.\n\n详细: \`data/audit/dual_source_audit_*.json\`\n\n跑 \`scripts/w32_fill_gaps.py --update-existing --update-slug-map\` 自动补全.`
                });
              }
            } catch (e) {
              console.log('skip:', e.message);
            }

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Dual-source audit failed"
          echo "Check: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"